[project]
name = "strawberry-chemist-example-manual-filters-orders"
version = "0.1.0"
requires-python = ">=3.11,<3.16"
dependencies = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.0.41",
    "starlette>=1.7.0",
    "strawberry-chemist==0.7.0",
    "strawberry-graphql>=0.311.1,<0.335",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
strawberry-chemist = { path = "../..", editable = true }
